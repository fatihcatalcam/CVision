<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts: preconnect + non-render-blocking load. The plain <link
         rel="stylesheet"> version blocked first paint on mobile until the font
         CSS arrived (LCP 5.7s). preload+swap lets the page paint immediately in
         the fallback font; display=swap then swaps the webfont in with no layout
         shift once it loads. <noscript> keeps it working without JS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    </noscript>

    <!-- Canonical: fold duplicate hosts (apex, *.vercel.app) into the primary
         domain. scripts/prerender.ts rewrites this per route and appends the
         hreflang set directly after it, so do not add alternates by hand -
         they would ship on every page, each one claiming to be the homepage's
         translation. Turkish holds the bare paths, English lives under /en;
         see src/i18n/routes.ts. -->
    <link rel="canonical" href="https://www.cvisionapp.com/" />


    <!-- Primary Meta -->
    <!-- Must stay identical to home.metaTitle / home.metaDescription in tr.ts:
         this file IS the homepage's head (prerender only rewrites the other
         routes), and useSeo overwrites both from tr.ts the moment React
         mounts. A mismatch shows up as the tab title changing on load. -->
    <title>Ücretsiz ATS CV Analizi ve Özgeçmiş Kontrolü | CVision</title>
    <meta name="description" content="Yapay zeka destekli CV ve özgeçmiş analizi. CV'ni yükle; anında ATS uyumluluk skoru, eksik anahtar kelimeler ve AI iyileştirme önerileri al. Ücretsiz başla." />
    <!-- Google has ignored meta keywords since 2009. Kept only because Yandex
         still reads it, and Yandex matters for the Turkish/Azerbaijani market.
         Nothing here counts as "using" a keyword - "özgeçmiş" sat in this tag
         and nowhere else on the site, which is why it ranked for none of it. -->
    <meta name="keywords" content="ATS CV analizi, özgeçmiş ATS kontrolü, ücretsiz CV analizi, ATS skoru, ATS uyumlu özgeçmiş, yapay zeka CV analizi, AI resume checker, ATS resume checker, CV optimization tool" />
    <meta name="author" content="CVision" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook önizlemesi)
         og:image is a purpose-built 1200x630 card, not logo.png. The logo is
         463x277 - below the 1200x630 that summary_large_image asks for - so
         every share was rendering it cropped or shrunk to a small thumbnail.
         Copy here is Turkish to match the card and the document language; the
         prerendered routes overwrite these per page from their own locale. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CVision - Yapay Zeka CV Analizi ve ATS Kontrolü" />
    <meta property="og:description" content="CV'ni veya özgeçmişini yükle; anında ATS uyumluluk skoru, eksik anahtar kelimeler ve yapay zeka ile yeniden yazım önerileri al. İlana göre eşleştir. Ücretsiz başla." />
    <meta property="og:image" content="https://www.cvisionapp.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CVision - CV'n ATS'ten geçiyor mu? Örnek ATS skoru 87." />
    <meta property="og:url" content="https://www.cvisionapp.com/" />
    <meta property="og:site_name" content="CVision" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CVision - Yapay Zeka CV Analizi ve ATS Kontrolü" />
    <meta name="twitter:description" content="CV'ni veya özgeçmişini yükle; anında ATS uyumluluk skoru, eksik anahtar kelimeler ve yapay zeka ile yeniden yazım önerileri al. İlana göre eşleştir. Ücretsiz başla." />
    <meta name="twitter:image" content="https://www.cvisionapp.com/og-image.png" />
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0EPB7MYJE3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0EPB7MYJE3');
    </script>

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xi7fzhgiu0");
    </script>

    <script>
      (function() {
        try {
          var t = localStorage.getItem('cvision-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- JSON-LD: Organization + WebSite + WebApplication (the product & pricing) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.cvisionapp.com/#organization",
          "name": "CVision",
          "url": "https://www.cvisionapp.com",
          "logo": "https://www.cvisionapp.com/logo.png",
          "description": "AI-powered CV and resume analysis tool that scores resumes for ATS compatibility and gives personalized, AI-generated improvement suggestions and career matches.",
          "email": "fthctlcm@outlook.com",
          "founder": { "@type": "Person", "name": "Fatih Çatalçam" },
          "areaServed": { "@type": "Place", "name": "Worldwide" }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.cvisionapp.com/#website",
          "name": "CVision",
          "url": "https://www.cvisionapp.com",
          "inLanguage": ["tr", "en"],
          "publisher": { "@id": "https://www.cvisionapp.com/#organization" }
        },
        {
          "@type": "WebApplication",
          "@id": "https://www.cvisionapp.com/#webapp",
          "name": "CVision",
          "url": "https://www.cvisionapp.com",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "inLanguage": ["tr", "en"],
          "description": "Upload a CV to get an instant ATS compatibility score, keyword analysis, AI rewrite suggestions, matching career paths, job-description matching, and AI-generated cover letters.",
          "publisher": { "@id": "https://www.cvisionapp.com/#organization" },
          "featureList": [
            "ATS compatibility score",
            "Keyword and completeness analysis",
            "AI bullet-point rewriting",
            "Full AI summary and suggestions",
            "Job-description matching with gap analysis",
            "AI cover letter generation"
          ],
          "offers": {
            "@type": "Offer",
            "name": "Free to start",
            "price": "0",
            "priceCurrency": "TRY",
            "description": "No subscription. A new account gets 3 credits - enough for one full Pro analysis - plus 2 more each week while the balance is low. A Normal analysis costs 1 credit, a Pro analysis 3, and job matching or a cover letter 2 each. Extra credits are sold in packs.",
            "url": "https://www.cvisionapp.com/pricing"
          }
        }
      ]
    }
    </script>

    <!-- FAQPage JSON-LD is deliberately absent: this file is the template for
         every prerendered route AND the SPA fallback, so anything added here
         ships on every URL. scripts/prerender.ts generates it from tr.ts and
         injects it into the homepage alone. See faqJsonLd() for why. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
